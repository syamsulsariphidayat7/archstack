name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build
        run: |
          GOOS=linux GOARCH=${{ matrix.goarch }} go build -o archstack-linux-${{ matrix.goarch }} .
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: archstack-linux-${{ matrix.goarch }}
          generate_release_notes: true
